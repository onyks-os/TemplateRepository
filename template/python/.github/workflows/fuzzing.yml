name: Dynamic Analysis (Fuzzing)

on:
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '0 0 * * 0'   # Weekly, Sunday at midnight UTC

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Scheduled runs get a much larger budget than PR runs, so pull requests
      # stay fast while the weekly job explores deeply.
      - name: Run Hypothesis fuzz tests
        env:
          HYPOTHESIS_PROFILE: ${{ github.event_name == 'schedule' && 'ci-deep' || 'ci' }}
        run: pytest fuzzing/ -v

  gate:
    name: Dynamic analysis gate
    runs-on: ubuntu-latest
    needs: fuzz
    if: always()
    steps:
      - name: Check fuzzing result
        env:
          RESULT: ${{ needs.fuzz.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "::error::Fuzzing failed. See DYNAMIC_ANALYSIS_POLICY.md for the triage process."
            exit 1
          fi
          echo "Dynamic analysis passed."
