site_name: {{PROJECT_SHORT}} - {{PROJECT_NAME}}
site_url: {{DOCS_URL}}
site_description: {{PROJECT_DESC}}
site_author: {{GITHUB_OWNER}}
site_dir: {{DOCS_SITE_DIR}}
docs_dir: docs/web
repo_url: https://github.com/{{GITHUB_OWNER}}/{{PROJECT_SLUG}}
repo_name: {{GITHUB_OWNER}}/{{PROJECT_SLUG}}
copyright: Copyright &copy; {{COPYRIGHT_YEAR}} {{GITHUB_OWNER}} — {{LICENSE_ID}}

theme:
  name: material
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

  palette:
    # Dark mode (default)
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
      primary: custom
      accent: custom
      media: "(prefers-color-scheme: dark)"

    # Light mode
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
      primary: custom
      accent: custom
      media: "(prefers-color-scheme: light)"

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid_init.js

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Tutorials:
      - Quickstart: tutorials/quickstart.md
  - How-To Guides:
      - Overview: how-to/index.md
  - Explanation:
      - Architecture: explanation/architecture.md
  - Reference:
      - CLI: reference/cli.md
      - Dependencies: reference/dependencies.md
  - Release Notes:
      - Changelog: release-notes/changelog.md
