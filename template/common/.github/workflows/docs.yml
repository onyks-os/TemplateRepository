name: Documentation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    name: Build MkDocs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install documentation toolchain
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material mkdocs

      # --strict turns broken links and missing nav entries into build failures,
      # so documentation rot is caught in review rather than after publication.
      - name: Build (strict)
        run: mkdocs build --strict --site-dir ./site

      - name: Upload site artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-site
          path: ./site
          retention-days: 7
