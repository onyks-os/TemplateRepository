name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    name: Build, sign, and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release and upload assets
      id-token: write   # Sigstore keyless signing via OIDC

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      # TODO(template): add the toolchain setup step this project needs before `make build`.

      - name: Build release artifacts
        run: make build

      - name: Generate SBOM
        run: |
          npm install -g @cyclonedx/cdxgen
          cdxgen -o dist/sbom.json

      - name: Generate checksums
        run: make checksums

      # Keyless signing: the certificate binds each artifact to this workflow and
      # tag, so there is no long-lived private key to compromise.
      # Verification instructions live in docs/verification.md.
      - name: Sign artifacts with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3.0.0
        with:
          inputs: |
            dist/*
            !dist/*.sigstore

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
