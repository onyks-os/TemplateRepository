name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    name: Build, sign, and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release and upload assets
      id-token: write   # Sigstore keyless signing via OIDC

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # TODO(template): add the toolchain setup step this project needs before `make build`.

      - name: Build release artifacts
        run: make build

      - name: Generate SBOM
        run: |
          npm install -g @cyclonedx/cdxgen
          cdxgen -o dist/sbom.json

      - name: Generate checksums
        run: make checksums

      # Keyless signing: the certificate binds each artifact to this workflow and
      # tag, so there is no long-lived private key to compromise.
      # Verification instructions live in docs/verification.md.
      - name: Sign artifacts with Sigstore
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          # Every line is expanded as a glob and must match at least one file:
          # a "!pattern" is not an exclusion but a literal path, and fails the
          # step. No .sigstore bundle exists yet at this point anyway.
          inputs: dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
