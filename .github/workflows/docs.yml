# The documentation site is published from onyks-os.github.io, which is a
# separate repository holding built output. Nothing there fails loudly when a
# link rots, so the build is gated here instead, in the repository that owns
# the sources.
name: Documentation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    name: Build MkDocs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          # Keyed on the pinned toolchain: without a dependency file the pip cache
          # fails the job, or silently keys on an unrelated pyproject.toml.
          cache-dependency-path: docs/requirements.txt

      - name: Install documentation toolchain
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      # docs/release-notes/changelog.md is generated from CHANGELOG.md by
      # `make docs-sync`. Regenerating it and failing on a diff keeps the
      # published release notes from drifting behind the root changelog.
      - name: Check the generated release notes are up to date
        run: |
          make docs-sync
          git diff --exit-code docs/release-notes/changelog.md \
            || { echo "::error::Run 'make docs-sync' and commit the result."; exit 1; }

      # --strict turns broken links and missing nav entries into build failures,
      # so documentation rot is caught in review rather than after publication.
      - name: Build (strict)
        run: mkdocs build --strict --site-dir ./site
