# The template pins every action it ships to a commit SHA. Those pins live in
# template/**/.github/workflows/, which Dependabot does not traverse — it only
# reads workflows under this repository's own .github/workflows/. Refreshing the
# shipped pins is therefore a manual step, documented in CONTRIBUTING.md.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"
  # The documentation toolchain pinned in docs/requirements.txt.
  - package-ecosystem: "pip"
    directory: "/docs"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "docs"
    labels:
      - "dependencies"
      - "documentation"
