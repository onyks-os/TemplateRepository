site_name: TemplateRepository
site_url: https://onyks-os.github.io/template-repository/
site_description: Documentation for TemplateRepository - a scaffolder that makes a new repository OSS-ready (governance, security policy, CI, documentation) from the first commit.
site_author: onyks-os
site_dir: ../onyks-os.github.io/template-repository
docs_dir: docs
repo_url: https://github.com/onyks-os/TemplateRepository
repo_name: onyks-os/TemplateRepository

theme:
  name: material
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

  palette:
    # Dark mode (default)
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Passa a light mode
      primary: custom
      accent: custom
      media: "(prefers-color-scheme: dark)"

    # Light mode
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Passa a dark mode
      primary: custom
      accent: custom
      media: "(prefers-color-scheme: light)"

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid_init.js

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Tutorials:
      - Scaffold a Repository: usage.md
  - Reference:
      - Interfaces: interfaces.md
      - Placeholders: placeholders.md
      - Language Profiles: profiles.md
  - Explanation:
      - Security Assessment: security-assessment.md
      - OpenSSF Criterion Mapping: openssf-checklist.md
  - Release Notes:
      - Changelog: release-notes/changelog.md
